<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar sua conta</title>
    <link rel="stylesheet" href="styleCriar.css">
</head>
<body>
    <img src="imagem/Resistrar-se.svg" class="fundo-svg">

    <div class="gota">
        <div class="titulo">Cada gota</div>
        <div class="inteligentemente"><strong>inteligentemente</strong></div>
        <div class="titulo1">controlada</div>
    </div>
        <div class="Crie-sua-conta" id="texto-azul">Crie sua conta</div>

    <div class="tituloNome" id="texto-azul">Nome completo</div>
    <div class="tituloEmail" id="texto-azul">Email</div>
    <div class="tituloSenha" id="texto-azul">Senha</div>

    <input type="text" id="nome" placeholder="Digite seu nome">
    <input type="text" id="email" placeholder="Digite seu email">
    <input type="password" id="senha" placeholder="Digite sua senha">
    
    <div class="container-lembrar" id="texto-azul">
        <input type="checkbox" id="lembrar-mim">
        <label for="lembrar-mim">Lembrar de mim</label>
    </div>
        
    <button type="submit" class="criar-conta">
        Criar
    </button>

    <p class="login">Já tem uma conta? Faça <a href="Entrar-Conta.html"><u><strong>login</strong></u></a></p>
</body>
</html>
