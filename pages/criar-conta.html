<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar sua conta</title>
    <link rel="stylesheet" href="../assets/css/criar.css">
    <link rel="icon" type="image/png" href="../assets/img/FaviconDelta.png">
</head>
<body>
    <img src="../assets/img/login.svg" class="fundo-svg">
    <a href="javascript:history.back()"><img src="../assets/img/voltar.svg" class="voltar"></a>

    <div class="gota">
        <div class="titulo">Cada gota</div>
        <div class="inteligentemente"><strong>inteligentemente</strong></div>
        <div class="titulo1">controlada</div>
        <img src="../assets/img/gluh-run.svg" class="glub">
    </div>

    <div class="crie-sua-conta">Crie sua conta</div>

    <label for="nome" class="tituloNome">Nome Completo</label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required data-required>

    <label for="telefone" class="tituloTelefone">Telefone</label>
    <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required data-required>

    <label for="email" class="tituloEmail">E-mail</label>
    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required data-required>

    <label for="senha" class="tituloSenha">Senha</label>
    <div class="campo-senha">
        <input type="password" id="senha" placeholder="Crie uma senha" required data-required>
        <button type="button" id="botaoOlho" aria-label="Alternar visibilidade da senha"><img id="iconeOlho" src="../assets/img/olho-fechado.svg" alt=""></button>
        <p id="mensagemSenha"></p>
    </div>
    <ul class="regras-senha" aria-label="Requisitos da senha">
        <li data-regra="tamanho">Pelo menos 8 caracteres</li>
        <li data-regra="letras">Uma letra maiúscula e minúscula</li>
        <li data-regra="numero-simbolo">Um número e caractere especial</li>
    </ul>
    <div class="container-lembrar">
        <input type="checkbox" id="lembrar-mim" name="lembrar">
        <label for="lembrar-mim">Lembrar de mim</label>
    </div>
    <div class="container-termos">
        <input type="checkbox" id="aceita-termos" name="aceita-termos" required data-required>
        <label for="aceita-termos">Eu li e estou ciente dos <a href="termos.html">termos de uso</a> e <a href="politicas.html">políticas de privacidade</a></label>
    </div>
    <button type="button" class="criar-conta" data-next="codigo-verificacao.html?flow=signup-email" data-validate-password>Criar conta</button>

    <p class="login">Já tem uma conta? Faça o <a href="../pages/entrar-conta.html"><u><strong>login</strong></u></a></p>
    <script src="../assets/js/mock-database.js"></script>
    <script src="../assets/js/mock-app.js"></script>
    <script src="../assets/js/script-criar-conta.js"></script>
</body>
</html>
