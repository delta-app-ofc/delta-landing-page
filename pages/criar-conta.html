<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar sua conta</title>
    <link rel="stylesheet" href="../assets/css/criar.css">
</head>
<body>
    <img src="../assets/img/login.svg" class="fundo-svg">
    <a href="javascript:history.back()"><img src="../assets/img/voltar.svg" class="voltar"></a>

    <div class="gota">
        <div class="titulo">Cada gota</div>
        <div class="inteligentemente"><strong>inteligentemente</strong></div>
        <div class="titulo1">controlada</div>
        <img src="../assets/img/gluh-run.svg" class="glub">
    </div>

    <div class="crie-sua-conta">Crie sua conta</div>

    <div class="botoes">
        <a href="criar-conta-usuario.html" class="usuario">Usuário</a>
        <a href="criar-conta-admin.html" class="adm">Administrador</a>
    </div>

    <div class="tituloNome">Nome completo</div>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required data-required>
    <div class="tituloEmail">Email</div>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required data-required>
    <div class="tituloSenha">Senha</div>
    <div class="campo-senha">
        <input type="password" id="senha" placeholder="Digite sua senha" required data-required>
        <button type="button" id="botaoOlho" aria-label="Alternar visibilidade da senha"><img id="iconeOlho" src="../assets/img/olho-fechado.svg"></button>
        <p id="mensagemSenha"></p>
    </div>
    <div class="container-lembrar">
        <input type="checkbox" id="lembrar-mim" name="lembrar">
        <label for="lembrar-mim">Lembrar de mim</label>
    </div>
    <button type="button" class="criar-conta" data-next="login-concluido.html" data-validate-password>Criar</button>

    <p class="login">Já tem uma conta? Faça <a href="../pages/entrar-conta.html"><u><strong>login</strong></u></a></p>
    <script src="../assets/js/script-criar-conta.js"></script>
</body>
</html>
