<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de Verificação</title>
    <link rel="stylesheet" href="../assets/css/codigo-verificacao.css">
    <link rel="icon" type="image/png" href="../assets/img/FaviconDelta.png">
    <link rel="stylesheet" href="../assets/css/responsive-core.css">
</head>
<body>
    <img src="../assets/img/codigo.svg" class="fundo-svg" alt="Fundo decorativo">
    <a href="email-verificacao.html"><img src="../assets/img/voltar.svg" class="voltar" alt="Voltar"></a>

    <div class="container">
        <h1 class="titulo">Insira o código abaixo:</h1>
        <p class="informacoes">Código enviado para o e-mail: ******exemplo@gmail.confirmar <a href="email-verificacao.html"><strong>Alterar e-mail</strong></a></p>

        <div class="grupo-inputs">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="codigo-input" required aria-label="Primeiro dígito do código">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="codigo-input" required aria-label="Segundo dígito do código">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="codigo-input" required aria-label="Terceiro dígito do código">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="codigo-input" required aria-label="Quarto dígito do código">
        </div>

        <p class="tempo">O código expira em 10:00</p>
        <button type="button" class="confirmar" data-next="recuperar-senha.html" data-code-form>Confirmar código</button>
        <p class="reenviar-codigo">Não recebeu o e-mail?<strong> Reenviar</strong></p>
        <p class="dica-codigo">Dica: copie o código do e-mail e cole na primeira caixa.</p>
        
    </div>
    <script src="../assets/js/mock-database.js"></script>
    <script src="../assets/js/mock-app.js"></script>
    <script src="../assets/js/script-recuperar-conta.js"></script>
</body>
</html>
