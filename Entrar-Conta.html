<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar em sua Conta</title>
    <link rel="stylesheet" href="styleEntrar.css">
</head>
<body>
    <img src="imagem/Resistrar-se.svg" class="fundo-svg">

    <div class="gota">
        <div class="titulo">Cada gota</div>
        <div class="inteligentemente"><strong>inteligentemente</strong></div>
        <div class="titulo1">controlada</div>
    </div>
        <div class="Crie-sua-conta" id="texto-azul">Acesse sua conta</div>

    <div class="tituloEmail" id="texto-azul">Email</div>
    <div class="tituloSenha" id="texto-azul">Senha</div>

    <input type="text" id="nome" placeholder="Digite seu nome">
    <input type="text" id="email" placeholder="Digite seu email">
    <input type="password" id="senha" placeholder="Digite sua senha">
    
    
    <p class="esqueceu" id="texto-azul">Esqueceu a senha?</p>    
        
    <button type="submit" class="criar-conta">
        Entrar
    </button>

    <p class="criar">Não possui uma conta? <a href="Criar-Conta.html"><u><strong>Registre-se </strong></u></a></p>

</html>
